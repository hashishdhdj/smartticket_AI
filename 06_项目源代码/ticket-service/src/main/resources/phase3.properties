smartticket.phase3.security-enabled=true
smartticket.phase3.record-tasks=true
smartticket.phase3.async-enabled=true
smartticket.phase3.users[0].id=100
smartticket.phase3.users[0].role=SUBMITTER
smartticket.phase3.users[0].token=${SMARTTICKET_SUBMITTER_TOKEN:}
smartticket.phase3.users[1].id=200
smartticket.phase3.users[1].role=HANDLER
smartticket.phase3.users[1].token=${SMARTTICKET_HANDLER_TOKEN:}
smartticket.phase3.users[2].id=900
smartticket.phase3.users[2].role=ADMIN
smartticket.phase3.users[2].token=${SMARTTICKET_ADMIN_TOKEN:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.ai.openai.chat.options.max-tokens=512
