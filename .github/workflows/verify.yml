name: Backend verification (no vendor calls)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_SMOKE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '06_项目源代码/ticket-service/pom.xml'
      - run: python3 '08_部署与环境/03_scripts/audit-knowledge.py'
      - run: python3 '08_部署与环境/03_scripts/verify-test-profiles.py'
      - run: python3 '08_部署与环境/03_scripts/verify-eval-datasets.py'
      - run: python3 -m unittest discover -s '08_部署与环境/03_scripts' -p 'test_*.py'
      - run: python3 -c "import sys; sys.path.insert(0, '08_部署与环境/03_scripts'); from graph_comparison import verify_dataset; verify_dataset()"
      - run: python3 '08_部署与环境/03_scripts/verify-quality-closure.py' --contracts-only
      - run: mvn -B -Punit test
        working-directory: '06_项目源代码/ticket-service'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-reports
          path: '06_项目源代码/ticket-service/target/surefire-reports/'
          retention-days: 7
  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_SMOKE: 'false'
      TZ: Asia/Shanghai
      MAVEN_OPTS: '-Duser.timezone=Asia/Shanghai'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '06_项目源代码/ticket-service/pom.xml'
      - run: python3 '08_部署与环境/03_scripts/prepare-phase4.py'
      - run: python3 '08_部署与环境/03_scripts/build-quality-artifact.py'
      - run: python3 '08_部署与环境/03_scripts/verify-agent-reception.py' --java "$JAVA_HOME/bin/java"
      # Real HTTP + MySQL/PG/RabbitMQ. Dialogue and embeddings are local protocol
      # fixtures here: no model downloads, paid endpoints or claimed BGE accuracy.
      - run: python3 '08_部署与环境/03_scripts/verify-graph-comparison.py' --offline-embedding --java "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: g5-offline-engineering-comparison
          path: |
            .tmp/g5-ci-comparison.json
            .tmp/g5-ci-comparison-generation-inputs.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-reports
          path: '06_项目源代码/ticket-service/target/surefire-reports/'
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-reception-offline-smoke
          path: .tmp/reception-http-smoke.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: verified-runtime
          path: |
            06_项目源代码/ticket-service/target/ticket-service-0.0.1-SNAPSHOT.jar
            .tmp/quality-artifact-build.json
          include-hidden-files: true
          retention-days: 7
